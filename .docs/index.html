<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Hunch Acts</title>
    <style>
        :root {
            --black: #000000;
            --dark-gray: #2f2f2f;
            --accent: #e6302f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--dark-gray);
            color: var(--black);
            font-family: Arial, sans-serif;
        }

        h1 {
            margin: 1rem 0 0;
            height: 122px;
            padding: 2rem 1rem;
            background: var(--black);
            color: var(--black);
            text-align: center;
            font-size: 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-top: 6px solid var(--accent);
            border-bottom: 6px solid var(--accent);
            -webkit-text-stroke: 2px var(--accent);
            text-shadow:
                2px 0 var(--accent),
                -2px 0 var(--accent),
                0 2px var(--accent),
                0 -2px var(--accent);
        }

        .title-subtitle {
            margin: 0.25rem 0 0;
            padding: 0;
            background: transparent;
            color: var(--accent);
            text-align: center;
            font-size: 1rem;
            font-weight: normal;
            -webkit-text-stroke: 0;
            text-shadow: none;
        }

        h2 {
            margin: 0;
            height: 80px;
            flex: 1;
            padding: 1rem;
            background: var(--accent);
            color: var(--black);
            text-align: center;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 6px solid var(--black);
            border-bottom: 6px solid var(--black);
        }

        .subtitle-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            max-width: 900px;
            margin: 1rem auto 0;
            padding: 0 1rem;
        }

        .text-section {
            width: auto;
            min-width: 0;
            max-width: none;
            flex: 1 1 0;
            margin: 50px 200px 0 50px;
            padding: 1rem;
            background: var(--black);
            text-align: left;
            border-top: 6px solid var(--accent);
            border-bottom: 6px solid var(--accent);
        }

        .text-section.right {
            margin-left: 200px;
            margin-right: 50px;
        }

        .text-sections-row {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .text-section h2 {
            width: fit-content;
            margin: 0 0 1rem;
            padding: 0 0 1rem;
            background: transparent;
            color: var(--accent);
            border: 0;
            border-bottom: 3px dashed var(--accent);
        }

        .text-section p {
            max-width: 900px;
            margin: 0;
            color: #ffffff;
            font-size: 1rem;
            line-height: 1.5;
        }

        .logo-box {
            flex: 0 0 80px;
            width: 80px;
            height: 80px;
            background: #ffffff;
            border: 6px solid var(--accent);
        }

        .logo-box img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @media (max-width: 600px) {
            .subtitle-row {
                gap: 0.5rem;
                padding: 0 0.5rem;
            }

            .logo-box {
                flex-basis: 60px;
                width: 60px;
                height: 60px;
            }

            h2 {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>
            <span>A.C.T.S.</span>
            <div class="title-subtitle">(semi) Autonomous Cargo Transport System</div>
        </h1>
        <div class="subtitle-row">
            <div class="logo-box" aria-label="Left logo placeholder"></div>
            <h2>NASA HUNCH 2026-27 External Cargo Robot Team</h2>
            <div class="logo-box" aria-label="Right logo">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSSZ0hGxvMwLWxLVGfxwCT8qhbjoe-SKo7Vc9R2t-NDZ3sdLJn975lURbvj&amp;s=10"
                    alt="Right logo">
            </div>
        </div>
        <div class="text-sections-row">
            <section class="text-section">
                <h2>Our Goal:</h2>
                <p>Design an autonomous cargo robot that can safely transport and deliver a storage container over a long
                    distance in a hazardous climate.</p>
            </section>
            <section class="text-section right">
                <h2>About Us:</h2>
                <p>About the team behind making all this work.</p>
            </section>
        </div>
    </header>
</body>

</html>
