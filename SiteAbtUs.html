<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Hunch Acts</title>
    <style>
        :root {
            --black: #000000;
            --dark-gray: #2f2f2f;
            --accent: #e6302f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--dark-gray);
            color: var(--black);
            font-family: Arial, sans-serif;
        }

        header {
            padding-bottom: 4rem;
        }

        h1 {
            margin: 1rem 0 0;
            height: 122px;
            padding: 2rem 1rem;
            background: var(--black);
            color: var(--black);
            text-align: center;
            font-size: 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-top: 6px solid var(--accent);
            border-bottom: 6px solid var(--accent);
            -webkit-text-stroke: 2px var(--accent);
            text-shadow:
                2px 0 var(--accent),
                -2px 0 var(--accent),
                0 2px var(--accent),
                0 -2px var(--accent);
        }

        .title-subtitle {
            margin: 0.25rem 0 0;
            padding: 0;
            background: transparent;
            color: var(--accent);
            text-align: center;
            font-size: 1rem;
            font-weight: normal;
            -webkit-text-stroke: 0;
            text-shadow: none;
        }

        h2 {
            margin: 0;
            height: 80px;
            flex: 1;
            padding: 1rem;
            background: var(--accent);
            color: var(--black);
            text-align: center;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 6px solid var(--black);
            border-bottom: 6px solid var(--black);
        }

        .intro {
            max-width: 900px;
            margin: 2.5rem auto 0;
            padding: 0 1.5rem;
            color: #ffffff;
            text-align: center;
            line-height: 1.6;
        }

        .intro strong {
            color: var(--accent);
        }

        .team-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            width: 100%;
            max-width: none;
            margin: 2.5rem 0 0;
            padding: 0;
        }

        .member-card {
            display: flex;
            flex-direction: column;
            padding: 1rem;
            background: var(--black);
            border: 6px solid var(--accent);
            box-shadow: 10px 10px 0 #171717;
        }

        .member-card:nth-child(odd) {
            margin-left: 50px;
            margin-right: 200px;
        }

        .member-card:nth-child(even) {
            margin-left: 200px;
            margin-right: 50px;
        }

        .headshot {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 220px;
            height: 220px;
            min-height: 0;
            background: #ffffff;
            color: var(--dark-gray);
            border: 3px dashed var(--accent);
            font-size: 0.9rem;
            text-align: center;
        }

        .member-top {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 1.25rem;
            align-items: start;
        }

        .member-top .headshot {
            grid-column: 2;
        }

        .member-top > div:last-child {
            grid-column: 1;
            grid-row: 1;
        }

        .member-card:nth-child(odd) .member-top .headshot {
            grid-column: 1;
        }

        .member-card:nth-child(odd) .member-top > div:last-child {
            grid-column: 2;
        }

        .member-top .headshot {
            min-height: 0;
        }

        .member-top h3 {
            margin-top: 0;
        }

        .member-card h3 {
            margin: 1.25rem 0 0.25rem;
            color: var(--accent);
            font-size: 1.4rem;
        }

        .member-card .role {
            margin: 0 0 0.75rem;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .member-card p {
            margin: 0;
            color: #ffffff;
            line-height: 1.5;
        }

        .subtitle-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            max-width: 900px;
            margin: 1rem auto 0;
            padding: 0 1rem;
        }

        .text-section {
            width: auto;
            min-width: 0;
            max-width: none;
            flex: 1 1 0;
            margin: 50px 200px 0 50px;
            padding: 1rem;
            background: var(--black);
            text-align: left;
            border-top: 6px solid var(--accent);
            border-bottom: 6px solid var(--accent);
        }

        .text-section.right {
            margin-left: 200px;
            margin-right: 50px;
        }

        .text-sections-row {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .text-section h2 {
            width: fit-content;
            margin: 0 0 1rem;
            padding: 0 0 1rem;
            background: transparent;
            color: var(--accent);
            border: 0;
            border-bottom: 3px dashed var(--accent);
        }

        .text-section p {
            max-width: 900px;
            margin: 0;
            color: #ffffff;
            font-size: 1rem;
            line-height: 1.5;
        }

        .logo-box {
            flex: 0 0 80px;
            width: 80px;
            height: 80px;
            background: #ffffff;
            border: 6px solid var(--accent);
        }

        .logo-box img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @media (max-width: 600px) {
            h1 {
                height: auto;
                min-height: 122px;
                font-size: 3rem;
            }

            .subtitle-row {
                gap: 0.5rem;
                padding: 0 0.5rem;
            }

            .logo-box {
                flex-basis: 60px;
                width: 60px;
                height: 60px;
            }

            h2 {
                font-size: 1rem;
            }

            .team-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .member-card {
                min-height: 0;
            }

            .member-card:nth-child(odd),
            .member-card:nth-child(even) {
                margin-left: 50px;
                margin-right: 50px;
            }

            .member-top {
                grid-template-columns: 1fr;
            }

            .member-top .headshot,
            .member-top > div:last-child {
                grid-column: auto;
                grid-row: auto;
            }

            .headshot {
                width: 100%;
                height: auto;
                aspect-ratio: 1 / 1;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>
            <span>A.C.T.S.</span>
            <div class="title-subtitle">(semi) Autonomous Cargo Transport System</div>
        </h1>
        <div class="subtitle-row">
            <div class="logo-box" aria-label="Left logo placeholder"></div>
            <h2>About Us:</h2>
            <div class="logo-box" aria-label="Right logo">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSSZ0hGxvMwLWxLVGfxwCT8qhbjoe-SKo7Vc9R2t-NDZ3sdLJn975lURbvj&amp;s=10"
                    alt="Right logo">
            </div>
        </div>
        <section class="intro">
        </section>
        <section class="team-grid" aria-label="ACTS team members">
            <article class="member-card">
                <div class="member-top">
                    <div class="headshot">[img]</div>
                    <div>
                        <h3>Owen Van Westenberg</h3>
                        <p class="role">Software & Web Design</p>
                        <p>[text here]</p>
                    </div>
                </div>
            </article>
            <article class="member-card">
                <div class="member-top">
                    <div class="headshot">[img]</div>
                    <div>
                        <h3>Jude Weaver</h3>
                        <p class="role">Prototype Design & Engineering</p>
                        <p>[text here]</p>
                    </div>
                </div>
            </article>
            <article class="member-card">
                <div class="member-top">
                    <div class="headshot">[img]</div>
                    <div>
                        <h3>Sawyer Rankin</h3>
                        <p class="role">Prototype Design & Engineering</p>
                        <p>[text here]</p>
                    </div>
                </div>
            </article>
        </div>
    </header>
</body>

</html>
